
name: File Network CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Qt runtime on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt

      - name: Check Python syntax
        run: python -m compileall -q app core database tests benchmarks scripts desktop.py

      - name: Run tests
        run: python -m pytest -v

      - name: Benchmark mixed documents on Windows
        if: runner.os == 'Windows'
        run: python -m benchmarks.content_analysis --dataset mixed --files 600 --output benchmark-Windows.json

      - name: Upload Windows benchmark summary
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mixed-document-benchmark-Windows
          path: benchmark-Windows.json
          if-no-files-found: ignore
          retention-days: 7

