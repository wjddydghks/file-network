name: Windows Desktop Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install desktop build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build Windows desktop
        run: python -m PyInstaller --noconfirm --clean FileNetwork.spec

      - name: Verify Windows executable without Python environment
        run: python scripts/verify_desktop.py dist/FileNetwork/FileNetwork.exe --report package-smoke-Windows.json

      - name: Upload verified Windows desktop
        uses: actions/upload-artifact@v4
        with:
          name: FileNetwork-Windows-x64
          path: dist/FileNetwork/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop verification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verification-Windows
          path: package-smoke-Windows.json
          if-no-files-found: ignore
          retention-days: 14
